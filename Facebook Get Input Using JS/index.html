<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
</head>

<body>
    <div class="container">
        <!-- container start here -->
        <div class="parent">
            <div class="child-logo">
                <img class="pakistan" src="hasnain.svg" alt="">
                <div class="text">
                    <p>Facebook helps you connect and share with the people in your life.</p>
                </div>
            </div>
            <div class="box">
                <div class="input1">
                    <input type="text" placeholder="Email Adress or Phone Number" id="email">
                </div>
                <div class="input2">
                    <input type="text" placeholder="Email Adress or Phone Number" id="num">
                </div>
                <div class="btn-parent">
                    <Button style="cursor: pointer;" onclick="check()">
                        Log In
                    </Button>
                    <div class="text-pass">
                        <p style="cursor: pointer;">
                            Forgotten password?
                        </p>
                    </div>
                    <div class="horizantal">
                        <hr>
                    </div>
                    <div class="create">
                        <button style="cursor: pointer;">
                            <a href="index2.html">Create New Account</a>
                        </button>
                    </div>
                </div>
            </div>

        </div>




































































        <!-- container end here -->

    </div>
    <script src="app.js">

    </script>
</body>

</html>
