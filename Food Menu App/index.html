    .typewriter {
  font-family: Arial, Helvetica, sans-serif;
  display: inline-block;
  position: relative;
  text-align: center;
  white-space: nowrap;
  text-shadow: 5px 4px 4px red;
  
  /* FIXED: Changed 'forwards' to 'infinite' and added a 5s loop duration */
  animation: reveal-text 3s linear infinite;
}

.typewriter::after {
  content: "";
  position: absolute;
  top: 0;
  width: 0px;
  height: 100%;
  background-color: rgb(240, 239, 239); /* Cursor color */
  
  /* FIXED: Cursor now matches the 5s loop time infinitely */
  animation: 
    move-cursor 5s linear infinite,
    blink-cursor 0.4s step-end infinite;
}
/* Unveils the text, pauses, then resets */
@keyframes reveal-text {
  0% { clip-path: inset(0 100% 0 0); }   /* Start: Hidden */
  50%, 90% { clip-path: inset(0 0% 0 0); } /* 50% to 90%: Fully Visible (Pause) */
  100% { clip-path: inset(0 0% 0 0); }  /* End: Disappears instantly to restart */
}

/* Moves the cursor along, pauses, then resets */
@keyframes move-cursor {
  0% { left: 0%; }
  50%, 90% { left: 100%; }
  100% { left: 0%; }
}

/* Makes the cursor blink continuously */
@keyframes blink-cursor {
  from, to { background-color: transparent; }
  50% { background-color: rgb(207, 204, 197); }
}
#text{
  max-width: 100%;
  /* text-wrap: balance; */
  text-align: justify;
}
  </style>
