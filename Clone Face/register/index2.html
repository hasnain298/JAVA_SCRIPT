<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook | Login</title>
    <link rel="stylesheet" href="style2.css">
</head>

<body>

    <div class="container">
        <!-- container start here -->
        <div class="parent">
            <div class="child-logo">
                <img class="pakistan" src="hasnain.svg" alt="">
                <div class="text">
                    <p>Facebook helps you connect and share with the people in your life.</p>
                </div>
            </div>
            <div class="box">
                <div class="input1">
                    <input type="text" placeholder="Email Adress or Phone Number" id="email">
                </div>
                <div class="input2">
                    <input type="password" placeholder="Enter Your Password" id="password">
                </div>
                <div class="btn-parent">
                    <Button style="cursor: pointer;" id="loginBtn">
                        Log In
                    </Button>
                    <div class="text-pass">
                        <p style="cursor: pointer;">
                            Forgotten password?
                        </p>
                    </div>
                    <div class="horizantal">
                        <hr>
                    </div>
                    <div class="create">
                        <button style="cursor: pointer;">
                            <a href="index.html">Create New Account</a>
                        </button>
                    </div>
                </div>
            </div>

        </div>
        <!-- container end here -->

    </div>
    <script src="app2.js">

    </script>

</body>

</html>
