<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="stylesheet" href="/Styles/signup.css">
</head>

<body>


    <!-- From Uiverse.io by Yaya12085 -->
    <form class="form" id="formSubmit">
        <p class="title">Register </p>
        <p class="message">Signup now and get full access to our app. </p>
        <div class="flex">
            <label>
                <input  placeholder="" type="text" class="input" id="firsttName">
                <span>Firstname</span>
            </label>

            <label>
                <input  placeholder="" type="text" class="input" id="lastName">
                <span>Lastname</span>
            </label>
        </div>

        <label>
            <input  placeholder="" type="email" class="input" id="email">
            <span>Email</span>
        </label>

        <label>
            <input  placeholder="" type="password" class="input" id="password">
            <span>Password</span>
        </label>
        <label>
            <input  placeholder="" type="password" class="input" id="confirmPassword">
            <span>Confirm password</span>
        </label>
        <button class="submit">Submit</button>
        <p class="signin">Already have an acount ? <a href="#">Signin</a> </p>
    </form>

    <script src="/JavaScript/signup.js"></script>
</body>

</html>
